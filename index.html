<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제로슈거마트</title>
</head>

<body>
  <p id="message">이동 중입니다.</p>
  <a id="openNaver" href="#" style="display:none;">네이버 앱에서 열기</a>

  <script>
    const webUrl = "https://smartstore.naver.com/0sugarmart";
    const encodedUrl = encodeURIComponent(webUrl);

    const isAndroid = /Android/i.test(navigator.userAgent);

    const isIOS =
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const naverScheme =
      "naversearchapp://inappbrowser?url=" +
      encodedUrl +
      "&target=new&version=6";

    const androidIntent =
      "intent://inappbrowser?url=" +
      encodedUrl +
      "&target=new&version=6" +
      "#Intent;" +
      "scheme=naversearchapp;" +
      "action=android.intent.action.VIEW;" +
      "category=android.intent.category.BROWSABLE;" +
      "package=com.nhn.android.search;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(webUrl) +
      ";end";

    const button = document.getElementById("openNaver");
    const message = document.getElementById("message");

    if (isAndroid) {
      message.textContent = "네이버 앱으로 이동 중입니다.";
      button.href = androidIntent;
      button.style.display = "inline";
      window.location.href = androidIntent;

    } else if (isIOS) {
      message.textContent = "네이버 앱으로 이동 중입니다.";
      button.href = naverScheme;
      button.style.display = "inline";
      window.location.href = naverScheme;

    } else {
      // Windows / Mac / Linux 등 PC
      window.location.replace(webUrl);
    }
  </script>
</body>
</html>
